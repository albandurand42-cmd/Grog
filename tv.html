<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROG — TV</title>
  <style>
    :root {
      --bg:      #0b0f14;
      --panel:   #121923;
      --text:    #e8eef6;
      --muted:   #91a0b3;
      --accent:  #7c5cff;
      --accent-2:#22c55e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #162033 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ── Layout principal ─────────────────────────────── */
    .tv-shell {
      display: grid;
      width: 100vw;
      height: 100vh;
      /* columns: pochette | paroles/titre | QR */
      grid-template-columns: min(30vh, 30vw) 1fr min(20vw, 24vh);
      grid-template-rows: 1fr auto;
      gap: 0;
    }

    /* ── Pochette ─────────────────────────────────────── */
    .tv-cover-col {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(1.5rem, 3vh, 3rem) clamp(0.5rem, 1.5vw, 1.5rem);
      padding-top: clamp(1rem, 2vh, 2rem);
    }

    #tv-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 1.5rem;
      box-shadow: 0 0 60px rgba(124, 92, 255, 0.35), 0 8px 40px rgba(0,0,0,0.6);
      display: none; /* affiché via JS */
      transition: opacity 0.2s ease-out;
    }

    .cover-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, #1e2a3a, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(3rem, 8vw, 7rem);
      color: var(--muted);
      transition: opacity 0.2s ease-out;
    }

    /* ── Colonne centrale (titre + artiste + progression + paroles) ─────────────────────────────── */
    .tv-info-col {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      padding: clamp(1rem, 2.5vh, 3rem) clamp(1.5rem, 3vw, 3rem);
      gap: clamp(0.3rem, 1vh, 1rem);
      overflow: hidden;
    }

    .tv-header {
      display: flex;
      flex-direction: column;
      gap: clamp(0.2rem, 0.8vh, 0.8rem);
      flex-shrink: 0;
    }

    #tv-title {
      font-size: clamp(1.8rem, 4.5vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s ease-out;
    }

    #tv-artist {
      font-size: clamp(1rem, 2.3vw, 2.5rem);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s ease-out;
    }

    /* Barre de progression */
    .tv-progress-track {
      width: 100%;
      height: clamp(8px, 1.2vh, 14px);
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    #tv-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: width 0.25s linear;
    }

    #tv-timer {
      font-size: clamp(1rem, 2vw, 2.2rem);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Paroles */
    .tv-lyrics-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      padding: clamp(1rem, 2vh, 2rem) 0;
    }

    #tv-lyrics {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(0.8rem, 2.5vh, 3rem);
      text-align: left;
    }

    .lyric-line {
      color: var(--muted);
      transition: color 0.3s, font-size 0.3s;
      line-height: 1.2;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .lyric-prev,
    .lyric-next {
      font-size: clamp(1.5rem, 2.2vw, 3rem);
    }

    .lyric-active {
      color: var(--text);
      font-size: clamp(2.5rem, 4vw, 5.5rem);
      font-weight: 700;
    }

    /* Message statut */
    #tv-status {
      font-size: clamp(0.9rem, 1.5vw, 1.3rem);
      color: var(--muted);
      text-align: center;
    }

    /* ── QR code ───────────────────────── */
    .tv-qr-col {
      grid-column: 3;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: clamp(1rem, 3vh, 3rem) clamp(1rem, 2vw, 2.5rem);
      gap: clamp(0.8rem, 1.5vh, 1.5rem);
    }

    .tv-qr-box {
      background: white;
      border-radius: 1.2rem;
      padding: clamp(10px, 1.2vw, 20px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tv-qr-box img {
      width: clamp(300px, 18vw, 520px);
      height: auto;
      aspect-ratio: 7 / 8;
      display: block;
      border-radius: 0.6rem;
      object-fit: contain;
    }

    .tv-qr-label {
      font-size: clamp(1rem, 1.5vw, 1.3rem);
      color: var(--muted);
      text-align: center;
      max-width: clamp(300px, 18vw, 520px);
      line-height: 1.4;
    }

    /* ── Barre du bas (GROG logo) ─────────────────────── */
    .tv-footer {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      padding: 0 clamp(0.5rem, 2vw, 2rem) clamp(0.5rem, 1.5vh, 1.5rem);
    }

    .tv-logo {
      font-size: clamp(1rem, 2vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.25em;
      color: var(--accent);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="tv-shell">

    <!-- Pochette -->
    <div class="tv-cover-col">
      <img id="tv-cover" alt="Pochette" />
      <div class="cover-placeholder" id="tv-cover-placeholder" aria-hidden="true">🎵</div>
    </div>

    <!-- Titre + Artiste + Progression + Paroles -->
    <div class="tv-info-col">
      <div class="tv-header">
        <div id="tv-title">Aucun morceau en cours</div>
        <div id="tv-artist"></div>
        <div class="tv-progress-track">
          <div id="tv-progress-fill"></div>
        </div>
        <div id="tv-timer">0:00 / 0:00</div>
      </div>

      <div class="tv-lyrics-wrap">
        <div id="tv-lyrics"></div>
      </div>

      <div id="tv-status"></div>
    </div>

    <!-- Logo bas -->
    <div class="tv-footer">
      <span class="tv-logo">GROG</span>
    </div>

    <!-- QR code -->
    <div class="tv-qr-col">
      <div class="tv-qr-box">
        <a href="https://albandurand42-cmd.github.io/Grog/" target="_blank" rel="noopener">
          <img src="qr-grog.png" alt="QR code GROG" />
        </a>
      </div>
      <p class="tv-qr-label">Scanne pour demander un son</p>
    </div>

  </div>

  <script type="module" src="tv.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROG — TV</title>
  <style>
    :root {
      --bg:      #0b0f14;
      --panel:   #121923;
      --text:    #e8eef6;
      --muted:   #91a0b3;
      --accent:  #7c5cff;
      --accent-2:#22c55e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #162033 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ── Conteneur principal ─────────────────────────────── */
    .tv-shell {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* ── Bloc supérieur : Pochette + Titre/Artiste/Progression ──────────────────── */
    .tv-top-block {
      position: absolute;
      left: 35px;
      top: 30px;
      display: flex;
      gap: 35px;
      align-items: flex-start;
      width: 1800px;
    }

    /* Pochette */
    .tv-cover-col {
      flex: 0 0 400px;
      width: 400px;
      height: 400px;
    }

    #tv-cover {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(124, 92, 255, 0.35), 0 8px 40px rgba(0,0,0,0.6);
      display: none;
    }

    .cover-placeholder {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e2a3a, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      color: var(--muted);
    }

    /* Bloc infos (titre, artiste, progression, timer) */
    .tv-info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #tv-title {
      font-size: 90px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
      word-wrap: break-word;
      overflow-wrap: break-word;
      max-width: 1300px;
      max-height: 230px;
      overflow: hidden;
    }

    #tv-artist {
      font-size: 40px;
      color: var(--muted);
      word-wrap: break-word;
      overflow-wrap: break-word;
      max-width: 850px;
    }

    /* Barre de progression */
    .tv-progress-track {
      width:1500px;
      height: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    #tv-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: width 0.25s linear;
    }

    #tv-timer {
      font-size: 24px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }

    /* ── Bloc paroles ─────────────────────────────────────── */
    .tv-lyrics-block {
      position: absolute;
      left: 50px;
      top: 450px;
      width: 1650px;
      height: 620px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tv-lyrics-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #tv-lyrics {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
    }

    .lyric-line {
      color: var(--muted);
      transition: color 0.3s, font-size 0.3s;
      line-height: 1.25;
      text-align: left;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .lyric-prev,
    .lyric-next {
      font-size: 30px;
      color: var(--muted);
    }

    .lyric-active {
      color: var(--text);
      font-size: 60px;
      font-weight: 700;
      line-height: 1.25;
    }
    
    #tv-status {
  display: none !important;
}

    /*
#tv-status {
  font-size: 14px;
  color: var(--muted);
  text-align: left;
  margin-top: 20px;
}
*/

    /* ── QR code (positionné en absolu) ─────────────────────────────── */
    .tv-qr-col {
      position: absolute;
      right: 50px;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .tv-qr-box {
      background: white;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .tv-qr-box img {
      width: 520px;
      height: auto;
      aspect-ratio: 7 / 8;
      display: block;
      border-radius: 6px;
      object-fit: contain;
    }

    .tv-qr-label {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      width: 520px;
      line-height: 1.3;
    }

    /* ── Logo GROG + Commentaire en bas à gauche ─────────────────────── */
    .tv-footer {
      position: absolute;
      left: 40px;
      bottom: 35px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 24px;
      z-index: 20;
    }

    .tv-logo {
      width: 300px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    /* ── Overlay commentaires (inline avec le logo) ──────────────────── */
    .tv-comment-overlay {
      max-width: 820px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-18px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .tv-comment-overlay.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .tv-comment-bubble {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(11, 15, 20, 0.82);
      border: 1px solid rgba(124, 92, 255, 0.45);
      box-shadow: 0 0 18px rgba(124, 92, 255, 0.25), 0 4px 20px rgba(0, 0, 0, 0.5);
      border-radius: 14px;
      padding: 14px 22px;
      backdrop-filter: blur(6px);
    }

    .tv-comment-name {
      font-size: 22px;
      font-weight: 700;
      color: #a78bfa;
      line-height: 1.2;
    }

    .tv-comment-text {
      font-size: 30px;
      color: #e8eef6;
      line-height: 1.3;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="tv-shell">

    <!-- Bloc haut : Pochette + Titre/Artiste/Progression/Timer -->
    <div class="tv-top-block">
      <div class="tv-cover-col">
        <img id="tv-cover" alt="Pochette" />
        <div class="cover-placeholder" id="tv-cover-placeholder" aria-hidden="true">🎵</div>
      </div>
      <div class="tv-info-col">
        <div id="tv-title">Aucun morceau en cours</div>
        <div id="tv-artist"></div>
        <div class="tv-progress-track">
          <div id="tv-progress-fill"></div>
        </div>
        <div id="tv-timer">0:00 / 0:00</div>
      </div>
    </div>

    <!-- Bloc paroles -->
    <div class="tv-lyrics-block">
      <div class="tv-lyrics-wrap">
        <div id="tv-lyrics"></div>
        <div id="tv-status"></div>
      </div>
    </div>

    <!-- QR code (absolu en bas à droite) -->
    <div class="tv-qr-col">
      <div class="tv-qr-box">
        <a href="https://albandurand42-cmd.github.io/Grog/" target="_blank" rel="noopener">
          <img src="qr-grog.png" alt="QR code GROG" />
        </a>
      </div>
      <p class="tv-qr-label">Scanne pour demander un son</p>
    </div>

    <!-- Logo GROG + Commentaires en bas à gauche -->
    <div class="tv-footer">
      <img class="tv-logo" src="tv-logo.png" alt="GROG">
      <!-- Overlay commentaires (à droite du logo) -->
      <div id="tv-comment-overlay" class="tv-comment-overlay" aria-live="polite" aria-atomic="true"></div>
    </div>

  </div>

  <script type="module">
    import { APP_VERSION } from './config.js';
    try {
      await import(`./tv.js?v=${encodeURIComponent(APP_VERSION)}`);
    } catch (error) {
      console.error('[TV] failed to load tv.js', error);
    }
  </script>
</body>
</html>

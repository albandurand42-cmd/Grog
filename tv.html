<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROG — TV</title>
  <style>
    :root {
      --bg:      #0b0f14;
      --panel:   #121923;
      --text:    #e8eef6;
      --muted:   #91a0b3;
      --accent:  #7c5cff;
      --accent-2:#22c55e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #162033 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ── Layout principal ─────────────────────────────── */
    .tv-shell {
      display: grid;
      width: 100vw;
      height: 100vh;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      gap: 0;
    }

    /* ── Zone haute (pochette + titre/artiste/progression) ─────────────────────────── */
    .tv-top-section {
      display: flex;
      gap: 30px;
      padding: 30px 40px;
      align-items: flex-start;
      min-height: 280px;
    }

    /* ── Pochette ─────────────────────────────────────── */
    .tv-cover-col {
      flex: 0 0 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 250px;
      min-height: 250px;
    }

    #tv-cover {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(124, 92, 255, 0.35), 0 8px 40px rgba(0,0,0,0.6);
      display: none;
    }

    .cover-placeholder {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e2a3a, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      color: var(--muted);
    }

    /* ── Infos et contrôles (titre/artiste/progression/timer) ─────────────────────── */
    .tv-info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: flex-start;
      padding-top: 0;
    }

    #tv-title {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.1;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      color: var(--text);
      max-height: 120px;
      overflow: hidden;
    }

    #tv-artist {
      font-size: 28px;
      color: var(--muted);
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Barre de progression */
    .tv-progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    #tv-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: width 0.25s linear;
    }

    #tv-timer {
      font-size: 24px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }

    /* ── Zone centrale (paroles) ─────────────────────────────────────── */
    .tv-middle-section {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 40px 60px;
      overflow: hidden;
      position: relative;
    }

    .tv-lyrics-wrap {
      width: calc(100% - 400px);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    #tv-lyrics {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
    }

    .lyric-line {
      color: var(--muted);
      transition: color 0.3s, font-size 0.3s;
      line-height: 1.2;
      text-align: left;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .lyric-prev,
    .lyric-next {
      font-size: 26px;
      color: var(--muted);
    }

    .lyric-active {
      color: var(--text);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.2;
    }

    /* Message statut */
    #tv-status {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
    }

    /* ── Zone basse (QR + GROG) ─────────────────────────────────────── */
    .tv-bottom-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 20px 40px 40px 40px;
      min-height: 120px;
      position: relative;
    }

    .tv-footer {
      display: flex;
      align-items: flex-end;
    }

    .tv-logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.25em;
      color: var(--accent);
      opacity: 0.5;
    }

    /* ── QR code ─────────────────────────────────────── */
    .tv-qr-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .tv-qr-box {
      background: white;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .tv-qr-box img {
      width: 300px;
      height: auto;
      aspect-ratio: 7 / 8;
      display: block;
      border-radius: 6px;
      object-fit: contain;
    }

    .tv-qr-label {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      width: 300px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="tv-shell">

    <!-- Zone haute : Pochette + Titre/Artiste/Progression -->
    <div class="tv-top-section">
      <div class="tv-cover-col">
        <img id="tv-cover" alt="Pochette" />
        <div class="cover-placeholder" id="tv-cover-placeholder" aria-hidden="true">🎵</div>
      </div>
      <div class="tv-info-col">
        <div id="tv-title">Aucun morceau en cours</div>
        <div id="tv-artist"></div>
        <div class="tv-progress-track">
          <div id="tv-progress-fill"></div>
        </div>
        <div id="tv-timer">0:00 / 0:00</div>
      </div>
    </div>

    <!-- Zone centrale : Paroles -->
    <div class="tv-middle-section">
      <div class="tv-lyrics-wrap">
        <div id="tv-lyrics"></div>
      </div>
      <div id="tv-status"></div>
    </div>

    <!-- Zone basse : GROG + QR -->
    <div class="tv-bottom-section">
      <div class="tv-footer">
        <span class="tv-logo">GROG</span>
      </div>
      <div class="tv-qr-col">
        <div class="tv-qr-box">
          <a href="https://albandurand42-cmd.github.io/Grog/" target="_blank" rel="noopener">
            <img src="qr-grog.png" alt="QR code GROG" />
          </a>
        </div>
        <p class="tv-qr-label">Scanne pour demander un son</p>
      </div>
    </div>

  </div>

  <script type="module" src="tv.js"></script>
</body>
</html>

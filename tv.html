<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROG — TV</title>
  <style>
    :root {
      --bg:      #0b0f14;
      --panel:   #121923;
      --text:    #e8eef6;
      --muted:   #91a0b3;
      --accent:  #7c5cff;
      --accent-2:#22c55e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #162033 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ── Layout principal ─────────────────── */
    .tv-shell {
      display: grid;
      width: 100vw;
      height: 100vh;
      /* columns: pochette | info+lyrics | QR */
      grid-template-columns: min(40vh, 42vw) 1fr min(18vh, 14vw);
      grid-template-rows: 1fr auto;
      gap: 0;
    }

    /* ── Pochette ───────────────────────── */
    .tv-cover-col {
      grid-column: 1;
      grid-row: 1 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 3vh, 3rem) clamp(0.5rem, 2vw, 2rem);
    }

    #tv-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 1.5rem;
      box-shadow: 0 0 60px rgba(124, 92, 255, 0.35), 0 8px 40px rgba(0,0,0,0.6);
      display: none; /* affiché via JS */
    }

    .cover-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, #1e2a3a, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(3rem, 8vw, 7rem);
      color: var(--muted);
    }

    /* ── Colonne centrale ─────────────────── */
    .tv-info-col {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1rem, 4vh, 4rem) clamp(0.5rem, 2vw, 2rem);
      gap: clamp(0.5rem, 1.5vh, 1.5rem);
      overflow: hidden;
    }

    #tv-title {
      font-size: clamp(1.6rem, 4.5vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #tv-artist {
      font-size: clamp(1rem, 2.5vw, 2.8rem);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barre de progression */
    .tv-progress-track {
      width: 100%;
      height: clamp(6px, 1vh, 12px);
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    #tv-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: width 0.25s linear;
    }

    #tv-timer {
      font-size: clamp(1rem, 2.2vw, 2.4rem);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Paroles */
    .tv-lyrics-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #tv-lyrics {
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(0.5rem, 2vh, 2rem);
    }

    .lyric-line {
      color: var(--muted);
      text-align: center;
      transition: color 0.3s, font-size 0.3s;
      line-height: 1.3;
    }

    .lyric-prev,
    .lyric-next {
      font-size: clamp(1.3rem, 2vw, 2.5rem);
    }

    .lyric-active {
      color: var(--text);
      font-size: clamp(2rem, 3.2vw, 4.5rem);
      font-weight: 600;
    }

    /* Message statut */
    #tv-status {
      font-size: 1rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── QR code + bande du bas ───────────── */
    .tv-qr-col {
      grid-column: 3;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: clamp(0.5rem, 2vh, 2rem) clamp(0.4rem, 1.2vw, 1.5rem);
      gap: 1rem;
    }

    .tv-qr-box {
      background: white;
      border-radius: 1rem;
      padding: clamp(6px, 1vw, 16px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tv-qr-box img {
      width: clamp(170px, 12vw, 300px);
      height: auto;
      display: block;
      border-radius: 0.4rem;
    }

    .tv-qr-label {
      font-size: clamp(0.7rem, 1.2vw, 1rem);
      color: var(--muted);
      text-align: center;
      max-width: clamp(170px, 12vw, 300px);
      line-height: 1.3;
    }

    /* ── Barre du bas (GROG logo) ───────────── */
    .tv-footer {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      padding: 0 clamp(0.5rem, 2vw, 2rem) clamp(0.5rem, 2vh, 1.5rem);
    }

    .tv-logo {
      font-size: clamp(1rem, 2vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.25em;
      color: var(--accent);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="tv-shell">

    <!-- Pochette -->
    <div class="tv-cover-col">
      <img id="tv-cover" alt="Pochette" />
      <div class="cover-placeholder" id="tv-cover-placeholder" aria-hidden="true">🎵</div>
    </div>

    <!-- Info + paroles -->
    <div class="tv-info-col">
      <div id="tv-title">Aucun morceau en cours</div>
      <div id="tv-artist"></div>

      <div class="tv-progress-track">
        <div id="tv-progress-fill"></div>
      </div>
      <div id="tv-timer">0:00 / 0:00</div>

      <div class="tv-lyrics-wrap">
        <div id="tv-lyrics"></div>
      </div>

      <div id="tv-status"></div>
    </div>

    <!-- Logo bas -->
    <div class="tv-footer">
      <span class="tv-logo">GROG</span>
    </div>

    <!-- QR code -->
    <div class="tv-qr-col">
      <div class="tv-qr-box">
        <a href="https://albandurand42-cmd.github.io/Grog/" target="_blank" rel="noopener">
          <img src="qr-grog.png" alt="QR code GROG" />
        </a>
      </div>
      <p class="tv-qr-label">Scanne pour demander un son</p>
    </div>

  </div>

  <script type="module" src="tv.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GROG DJ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app-shell">

    <header class="topbar">
      <div>
        <p class="eyebrow">SOIRÉE</p>
        <h1>GROG DJ</h1>
        <p class="subtitle">
          Demande ton son 👇
        </p>
      </div>
    </header>


    <!-- NOM -->

    <section class="card">

      <h2>Ton prénom</h2>

      <input
        id="guest-name"
        type="text"
        maxlength="30"
        placeholder="Facultatif"
      >

      <p class="muted">
        Tu peux rester anonyme.
      </p>

    </section>


    <!-- RECHERCHE -->

    <section class="card">

      <h2>🎵 Tu veux entendre quoi ?</h2>

      <div class="search-row">

        <input
          id="spotify-search"
          type="search"
          placeholder="Titre ou artiste..."
        >

        <button
          id="search-button"
          type="button"
          class="primary"
        >
          Rechercher
        </button>

      </div>

      <div
        id="search-status"
        class="muted"
      ></div>

      <div id="search-results"></div>

    </section>


    <!-- DEMANDES -->

    <section class="card">

      <h2>🔥 Morceaux demandés</h2>

      <div id="request-list">
        <p class="muted">
          Aucun morceau demandé pour le moment.
        </p>
      </div>

    </section>


    <!-- VOLUME -->

    <section class="card">

      <h2>🔊 Le son ?</h2>

      <div class="row">

        <button
          id="quieter-button"
          type="button"
          class="secondary"
        >
          🔉 Moins fort
        </button>

        <button
          id="louder-button"
          type="button"
          class="primary"
        >
          🔊 Plus fort
        </button>

      </div>

      <p
        id="volume-status"
        class="muted"
      ></p>

    </section>

  </main>

  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>

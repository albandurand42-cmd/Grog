<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grog — Demande un morceau</title>
    <meta name="description" content="Suggère un morceau au DJ ce soir." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Soirée en cours</p>
          <h1>GROG DJ 🎶</h1>
        </div>
      </header>

      <!-- Prénom facultatif -->
      <section class="card" aria-labelledby="name-title">
        <h2 id="name-title">Ton prénom (facultatif)</h2>
        <input id="guest-name" type="text" placeholder="Ex : Alex" autocomplete="given-name" maxlength="40" />
      </section>

      <!-- En ce moment -->
      <section class="card now-playing-public" aria-labelledby="np-public-title">
        <h2 id="np-public-title">🎧 En ce moment</h2>
        <div id="now-playing-display" class="now-playing-public-layout">
          <div class="empty-state">Le DJ n'a pas encore renseigné le morceau en cours.</div>
        </div>
      </section>

      <!-- Recherche Spotify -->
      <section class="card" aria-labelledby="search-title">
        <h2 id="search-title">🔎 Demander un son</h2>
        <label class="search-row">
          <span class="sr-only">Rechercher un morceau</span>
          <input id="search-input" type="search" placeholder="Titre, artiste…" autocomplete="off" />
          <button id="search-btn" type="button" class="primary">Rechercher</button>
        </label>
        <div id="search-results" class="empty-state" role="region" aria-live="polite" aria-label="Résultats">
          Les résultats apparaîtront ici.
        </div>
      </section>

      <!-- File de demandes en direct -->
      <section class="card" aria-labelledby="queue-title">
        <h2 id="queue-title">🔥 Morceaux demandés</h2>
        <div id="queue-list" role="region" aria-live="polite" aria-label="File d'attente">
          <div class="empty-state">Aucune demande pour le moment.</div>
        </div>
      </section>

      <!-- Vote volume -->
      <section class="card" aria-labelledby="volume-title">
        <h2 id="volume-title">🔊 Le volume ?</h2>
        <div class="volume-counter-row">
          <button id="vol-down" type="button" class="vol-btn vol-btn-minus" aria-label="Baisser le volume">−1</button>
          <div class="vol-score-wrap">
            <span id="vol-score" class="vol-score">0</span>
            <span id="vol-hint" class="vol-hint muted"></span>
          </div>
          <button id="vol-up" type="button" class="vol-btn vol-btn-plus" aria-label="Monter le volume">+1</button>
        </div>
      </section>

      <!-- Commentaires -->
      <section class="card" aria-labelledby="comment-title">
        <h2 id="comment-title">💬 Laisser un commentaire</h2>
        <div class="comment-form">
          <textarea
            id="comment-message"
            placeholder="Un message pour la soirée..."
            maxlength="160"
            rows="3"
          ></textarea>
          <div class="comment-char-counter"><span id="comment-char-count">0</span> / 160</div>
          <button id="btn-send-comment" type="button" class="primary">Envoyer</button>
          <p id="comment-feedback" class="muted" aria-live="polite"></p>
        </div>
      </section>

    <script type="module" src="app.js"></script>
  </body>
</html>

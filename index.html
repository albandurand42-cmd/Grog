<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grog — Demande un morceau</title>
    <meta name="description" content="Suggère un morceau au DJ ce soir." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Soirée en cours</p>
          <h1>Grog 🎶</h1>
          <p class="subtitle">Recherche un morceau et demande-le au DJ.</p>
        </div>
        <a href="admin.html" class="status-pill" aria-label="Page admin DJ">Admin</a>
      </header>

      <!-- Prénom facultatif -->
      <section class="card" aria-labelledby="name-title">
        <h2 id="name-title">Ton prénom (facultatif)</h2>
        <input id="guest-name" type="text" placeholder="Ex : Alex" autocomplete="given-name" maxlength="40" />
      </section>

      <!-- Recherche Spotify -->
      <section class="card" aria-labelledby="search-title">
        <h2 id="search-title">Rechercher un morceau</h2>
        <label class="search-row">
          <span class="sr-only">Rechercher un morceau</span>
          <input id="search-input" type="search" placeholder="Titre, artiste…" autocomplete="off" />
          <button id="search-btn" type="button" class="primary">Rechercher</button>
        </label>
        <div id="search-results" class="empty-state" role="region" aria-live="polite" aria-label="Résultats">
          Les résultats apparaîtront ici.
        </div>
      </section>

      <!-- File de demandes en direct -->
      <section class="card" aria-labelledby="queue-title">
        <h2 id="queue-title">Morceaux demandés</h2>
        <div id="queue-list" role="region" aria-live="polite" aria-label="File d'attente">
          <div class="empty-state">Aucune demande pour le moment.</div>
        </div>
      </section>

      <!-- Vote volume -->
      <section class="card" aria-labelledby="volume-title">
        <h2 id="volume-title">Volume</h2>
        <p class="muted">Un seul vote par session.</p>
        <div class="vote-row">
          <button id="vol-down" type="button" class="secondary vote-btn" aria-label="Baisser le volume">
            🔉 Moins fort
          </button>
          <button id="vol-up" type="button" class="secondary vote-btn" aria-label="Monter le volume">
            🔊 Plus fort
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
